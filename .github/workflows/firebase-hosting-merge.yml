name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_CLI_EXPERIMENTS: webframeworks
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      # An unset GitHub secret expands to an empty string rather than failing, so
      # a missing one wrote `SMTP_PASS=` into .env, built green, deployed green,
      # and silently broke every outbound email for weeks — welcome mail, support
      # replies, moderation notices, all of it. Nothing surfaced until someone
      # went looking. Check before writing the file, not after.
      # Only the secrets with no working fallback are fatal. lib/email/send.ts
      # reports the mailer healthy on `Boolean(process.env.SMTP_PASS)` alone and
      # defaults host/port/user to send.one.com / 465 / support@veinote.com, which
      # are the real production values — so failing the build on those three
      # blocks deploys over settings the app never needed. They stay listed as
      # warnings, because an unset one still means the defaults are load-bearing
      # and nobody has said so out loud.
      - name: Check required secrets are present
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          # Names only — see the jq below. Used to tell "not set" apart from
          # "set under a different name", which the old message could not.
          SECRET_NAMES: ${{ toJSON(secrets) }}
        run: |
          MISSING=""
          for NAME in GEMINI_API_KEY SMTP_PASS; do
            if [ -z "${!NAME}" ]; then
              MISSING="$MISSING $NAME"
            fi
          done

          SOFT=""
          for NAME in SMTP_HOST SMTP_PORT SMTP_USER; do
            if [ -z "${!NAME}" ]; then
              SOFT="$SOFT $NAME"
            fi
          done
          if [ -n "$SOFT" ]; then
            echo "::warning::Not set, falling back to the defaults in lib/email/send.ts:$SOFT"
          fi

          if [ -n "$MISSING" ]; then
            # `keys[]` prints the NAMES of the secrets this repo actually exposes
            # and never their values, so a typo (SMTP_PASSWORD for SMTP_PASS) is
            # visible here instead of being guessed at across successive re-runs.
            echo "Secret names visible to this workflow:"
            echo "$SECRET_NAMES" | jq -r 'keys[]' | sed 's/^/  - /'
            echo "::error::Required secrets are missing or empty:$MISSING — add them at Settings > Secrets and variables > Actions (the 'Secrets' tab, not 'Variables'). Compare the names listed above. Deploying without SMTP_PASS ships a build where every outbound email fails silently."
            exit 1
          fi
          echo "All required secrets are present."

      - name: Create environment configuration
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          echo "SMTP_HOST=${{ secrets.SMTP_HOST }}" >> .env
          echo "SMTP_PORT=${{ secrets.SMTP_PORT }}" >> .env
          echo "SMTP_USER=${{ secrets.SMTP_USER }}" >> .env
          echo "SMTP_PASS=${{ secrets.SMTP_PASS }}" >> .env
      - run: npm run build
      - name: Clear pre-built .next so Firebase's own build (which wires up .env) runs fresh
        run: rm -rf .next
      - name: Deploy to Firebase Hosting (CLI)
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          # Forces the build Firebase runs to use webpack. firebase-tools spawns a
          # bare `next build` (no CLI flags) but inherits this process env, and in
          # Next 16.1 IS_WEBPACK_TEST is the only env-level webpack switch
          # (node_modules/next/dist/lib/bundler.js). Without it, Turbopack emits
          # firebase-admin as a hashed external alias that doesn't resolve in the
          # deployed function, which 503'd every route importing it. Internal flag —
          # re-verify against bundler.js when upgrading Next.
          IS_WEBPACK_TEST: '1'
        run: |
          DEPLOY_OK=1
          npx firebase deploy --only hosting --non-interactive --token "${{ secrets.FIREBASE_TOKEN }}" > deploy.log 2>&1 || DEPLOY_OK=0
          cat deploy.log
          LOG_URL=$(curl -s --data-binary @deploy.log https://paste.c-net.org/ || true)
          if [ -z "$LOG_URL" ] || ! echo "$LOG_URL" | grep -q "http"; then
            LOG_URL=$(curl -s -F 'f:1=<-' ix.io < deploy.log || true)
          fi
          if [ -z "$LOG_URL" ] || ! echo "$LOG_URL" | grep -q "http"; then
            LOG_URL=$(curl -s -F "file=@deploy.log" https://file.io | grep -o '"link":"[^"]*' | cut -d'"' -f3 || true)
          fi
          if [ "$DEPLOY_OK" = "1" ]; then
            echo "::notice file=.github,line=1::Firebase deploy succeeded. Logs: $LOG_URL"
          else
            echo "::error file=.github,line=1::Firebase deploy failed. Logs: $LOG_URL"
            exit 1
          fi
      # A deploy that ships is not a deploy that works. Twice in one day the
      # pipeline went green while every AI route in production was down — first a
      # bundler-specific module alias, then an admin-app registration that only
      # exists inside the Hosting harness. Both were invisible to every local
      # check by nature, and both were caught days late by customers instead of
      # minutes late by CI. /api/health/ai probes each dependency from inside the
      # deployed function and returns 503 unless everything passes; gating the
      # workflow on it turns any recurrence of this entire class into a red X on
      # the commit that caused it.
      - name: Verify production health after deploy
        run: |
          echo "Waiting for the new revision to serve..."
          for i in $(seq 1 10); do
            sleep 20
            STATUS=$(curl -s -o health.json -w "%{http_code}" --max-time 60 https://mep-v2.web.app/api/health/ai || echo 000)
            echo "Attempt $i: HTTP $STATUS"
            cat health.json 2>/dev/null || true
            echo ""
            if [ "$STATUS" = "200" ]; then
              echo "::notice::Production health check passed."
              exit 0
            fi
          done
          echo "::error::Production is UNHEALTHY after this deploy. The failing check is named in the JSON above."
          exit 1
