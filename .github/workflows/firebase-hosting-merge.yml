name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_CLI_EXPERIMENTS: webframeworks
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      # An unset GitHub secret expands to an empty string rather than failing, so
      # a missing one wrote `SMTP_PASS=` into .env, built green, deployed green,
      # and silently broke every outbound email for weeks — welcome mail, support
      # replies, moderation notices, all of it. Nothing surfaced until someone
      # went looking. Check before writing the file, not after.
      # Only the secrets with no working fallback are fatal. lib/email/send.ts
      # reports the mailer healthy on `Boolean(process.env.SMTP_PASS)` alone and
      # defaults host/port/user to send.one.com / 465 / support@veinote.com, which
      # are the real production values — so failing the build on those three
      # blocks deploys over settings the app never needed. They stay listed as
      # warnings, because an unset one still means the defaults are load-bearing
      # and nobody has said so out loud.
      - name: Check required secrets are present
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          # Likely near-miss names, so "added under the wrong name" reports itself
          # instead of looking identical to "never added".
          #
          # Do NOT swap these for a whole-context dump to enumerate every name.
          # Serialising the entire secrets context expands all secret VALUES into
          # one variable; GitHub's malicious-workflow detection flags that, and the
          # run then sits unstarted awaiting manual approval (this step did once,
          # run #187). Individual named references answer the same question safely.
          ALT_SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALT_SMTP_PW: ${{ secrets.SMTP_PW }}
          ALT_MAIL_PASS: ${{ secrets.MAIL_PASS }}
          ALT_EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          ALT_ONECOM_PASS: ${{ secrets.ONECOM_PASS }}
        run: |
          # Length + hash prefix of the mail password, to compare against
          # /api/health/ai's fingerprint. The value itself never prints —
          # this exists because a stale value once survived three secret
          # "updates" and only a run-time fingerprint could say which link
          # of the chain still held the old one.
          echo "SMTP_PASS as this run sees it: ${#SMTP_PASS} chars, fingerprint $(printf %s "$SMTP_PASS" | sha256sum | cut -c1-12)"

          MISSING=""
          for NAME in GEMINI_API_KEY; do
            if [ -z "${!NAME}" ]; then
              MISSING="$MISSING $NAME"
            fi
          done

          SOFT=""
          for NAME in SMTP_HOST SMTP_PORT SMTP_USER; do
            if [ -z "${!NAME}" ]; then
              SOFT="$SOFT $NAME"
            fi
          done
          if [ -n "$SOFT" ]; then
            echo "::warning::Not set, falling back to the defaults in lib/email/send.ts:$SOFT"
          fi

          # SMTP_PASS stopped being fatal when COLLAB_EMAIL_INVITES_ENABLED went false:
          # the one feature that would have shipped visibly broken without it now
          # refuses its own mail-dependent branch instead. It is still loud, because
          # every other outbound mail — welcome, support replies, moderation notices,
          # admin replies — has no such guard and fails silently while this is unset.
          # Make it fatal again, and flip that flag back on, once the secret is added.
          if [ -z "$SMTP_PASS" ]; then
            echo "::warning::SMTP_PASS is not set — ALL outbound email fails silently in this deploy. Collaboration invites by email are disabled in code to match (lib/uiFlags.ts). Add it at Settings > Secrets and variables > Actions, on the 'Secrets' tab."
          fi

          if [ -n "$MISSING" ]; then
            # Presence of near-miss names, never their contents — this reports
            # "something is set, under the wrong name", which is the one thing the
            # bare missing-list could not distinguish from "nothing was added".
            FOUND=""
            for PAIR in "SMTP_PASSWORD:$ALT_SMTP_PASSWORD" "SMTP_PW:$ALT_SMTP_PW" \
                        "MAIL_PASS:$ALT_MAIL_PASS" "EMAIL_PASS:$ALT_EMAIL_PASS" \
                        "ONECOM_PASS:$ALT_ONECOM_PASS"; do
              if [ -n "${PAIR#*:}" ]; then
                FOUND="$FOUND ${PAIR%%:*}"
              fi
            done
            if [ -n "$FOUND" ]; then
              echo "::warning::These similarly-named secrets ARE set:$FOUND — the app reads SMTP_PASS specifically (lib/email/send.ts). Rename, or add SMTP_PASS with the same value."
            fi
            echo "::error::Required secrets are missing or empty:$MISSING — add them at Settings > Secrets and variables > Actions, on the 'Secrets' tab (not 'Variables'). These have no fallback in code, so the features that read them fail at runtime rather than here."
            exit 1
          fi
          echo "All required secrets are present."

      # Secrets reach this step as real environment variables and are written with
      # printf — never spliced into the shell script text. The old form,
      # `echo "SMTP_PASS=${{ secrets.SMTP_PASS }}"`, let bash expand a $-sequence
      # inside the password itself, deterministically corrupting it on every deploy
      # while every secret "update" appeared to change nothing (four deploys chased
      # a "stale secret" that was never stale, 2026-08-16). Values are single-quoted
      # so neither firebase-tools' env parser nor dotenv-expand touches a $ inside.
      - name: Create environment configuration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          : > .env
          for NAME in GEMINI_API_KEY SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS; do
            VALUE="${!NAME}"
            case "$VALUE" in *"'"*)
              echo "::error::$NAME contains a single quote, which this quoted .env write cannot carry. Rotate the value or extend this step to escape it."
              exit 1;;
            esac
            printf "%s='%s'\n" "$NAME" "$VALUE" >> .env
          done
      - run: npm run build
      - name: Clear pre-built .next so Firebase's own build (which wires up .env) runs fresh
        run: rm -rf .next
      - name: Deploy to Firebase Hosting (CLI)
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          # Forces the build Firebase runs to use webpack. firebase-tools spawns a
          # bare `next build` (no CLI flags) but inherits this process env, and in
          # Next 16.1 IS_WEBPACK_TEST is the only env-level webpack switch
          # (node_modules/next/dist/lib/bundler.js). Without it, Turbopack emits
          # firebase-admin as a hashed external alias that doesn't resolve in the
          # deployed function, which 503'd every route importing it. Internal flag —
          # re-verify against bundler.js when upgrading Next.
          IS_WEBPACK_TEST: '1'
        run: |
          # Retried once. `Failed to fetch Run service …/ssrmepv2` has twice ended
          # a deploy that had already done its work — files uploaded, function
          # reporting "Successful update operation" — and then died on a metadata
          # read while finalizing the version (runs #230 and #241). A second
          # attempt is cheap and idempotent: unchanged files are skipped by hash,
          # and re-applying the same function source is a no-op.
          DEPLOY_OK=0
          for attempt in 1 2; do
            if npx firebase deploy --only hosting --non-interactive --token "${{ secrets.FIREBASE_TOKEN }}" > deploy.log 2>&1; then
              DEPLOY_OK=1
              break
            fi
            if [ "$attempt" = "1" ]; then
              echo "::warning::Deploy attempt 1 failed; retrying once. Tail of the log:"
              tail -20 deploy.log
              sleep 20
            fi
          done
          cat deploy.log
          LOG_URL=$(curl -s --data-binary @deploy.log https://paste.c-net.org/ || true)
          if [ -z "$LOG_URL" ] || ! echo "$LOG_URL" | grep -q "http"; then
            LOG_URL=$(curl -s -F 'f:1=<-' ix.io < deploy.log || true)
          fi
          if [ -z "$LOG_URL" ] || ! echo "$LOG_URL" | grep -q "http"; then
            LOG_URL=$(curl -s -F "file=@deploy.log" https://file.io | grep -o '"link":"[^"]*' | cut -d'"' -f3 || true)
          fi
          if [ "$DEPLOY_OK" = "1" ]; then
            echo "::notice file=.github,line=1::Firebase deploy succeeded. Logs: $LOG_URL"
          else
            echo "::error file=.github,line=1::Firebase deploy failed. Logs: $LOG_URL"
            exit 1
          fi
      # A deploy that ships is not a deploy that works. Twice in one day the
      # pipeline went green while every AI route in production was down — first a
      # bundler-specific module alias, then an admin-app registration that only
      # exists inside the Hosting harness. Both were invisible to every local
      # check by nature, and both were caught days late by customers instead of
      # minutes late by CI. /api/health/ai probes each dependency from inside the
      # deployed function and returns 503 unless everything passes; gating the
      # workflow on it turns any recurrence of this entire class into a red X on
      # the commit that caused it.
      #
      # `if: always()` because the step above can fail AFTER the deploy has
      # effectively landed — see the retry note there. Sequenced normally, a
      # failed deploy skips this check entirely, which is precisely when the
      # state of production is least known: twice now that has meant finding out
      # by hand whether the site was up. Running it regardless means the run's
      # colour reflects whether production is healthy, not whether one metadata
      # call happened to answer.
      - name: Verify production health after deploy
        if: always()
        run: |
          echo "Waiting for the new revision to serve..."
          for i in $(seq 1 10); do
            sleep 20
            STATUS=$(curl -s -o health.json -w "%{http_code}" --max-time 60 https://mep-v2.web.app/api/health/ai || echo 000)
            echo "Attempt $i: HTTP $STATUS"
            cat health.json 2>/dev/null || true
            echo ""
            if [ "$STATUS" = "200" ]; then
              echo "::notice::Production health check passed."
              exit 0
            fi
          done
          echo "::error::Production is UNHEALTHY after this deploy. The failing check is named in the JSON above."
          exit 1
