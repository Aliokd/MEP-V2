name: Deploy to Firebase Hosting on PR
'on': pull_request
jobs:
  build_and_preview:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    env:
      FIREBASE_CLI_EXPERIMENTS: webframeworks
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      # Written via env vars + printf, not textual splicing — see the same step in
      # firebase-hosting-merge.yml for why (a $ inside a secret gets expanded by
      # bash and silently corrupts the value).
      - name: Create environment configuration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          : > .env
          for NAME in GEMINI_API_KEY SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS; do
            VALUE="${!NAME}"
            case "$VALUE" in *"'"*)
              echo "::error::$NAME contains a single quote, which this quoted .env write cannot carry. Rotate the value or extend this step to escape it."
              exit 1;;
            esac
            printf "%s='%s'\n" "$NAME" "$VALUE" >> .env
          done
      - run: npm run build
      - name: Deploy to Firebase Hosting Channel (CLI)
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          # Same webpack forcing as the merge workflow — see the note there.
          IS_WEBPACK_TEST: '1'
        run: |
          npx firebase hosting:channel:deploy pr-${{ github.event.pull_request.number }} --non-interactive --token "${{ secrets.FIREBASE_TOKEN }}"
